name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile source
        run: python -m compileall -q src

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,package]"
          python -m pip check

      - name: Sidecar CLI smoke
        run: python -m course_project.sidecar --help

      - name: Windows full Python test suite
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build React desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build and smoke packaged Python Sidecar
        working-directory: apps/desktop
        run: npm run sidecar:smoke

      - name: Check Tauri Rust shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Record environment doctor evidence
        run: course-project-doctor --json

      - name: Test Tauri Sidecar bridge
        shell: pwsh
        run: |
          $targetTriple = (rustc --print host-tuple).Trim()
          $env:COURSE_PROJECT_SIDECAR_EXECUTABLE = (Resolve-Path "apps/desktop/src-tauri/binaries/course-project-sidecar-$targetTriple.exe")
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml sidecar_register_inspect_and_read_range_round_trip

      - name: Build Windows NSIS installer with bundled Sidecar
        working-directory: apps/desktop
        run: npm run bundle:windows

      - name: Rehearse clean Windows install and launch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced"
          }

          $installDir = Join-Path $env:RUNNER_TEMP "evidence-workbench-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $installDir) {
            throw "Clean rehearsal directory already exists: $installDir"
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with $($install.ExitCode)"
          }

          $desktopExecutable = Join-Path $installDir "course-project-desktop.exe"
          $sidecarExecutable = Join-Path $installDir "course-project-sidecar.exe"
          foreach ($required in @($desktopExecutable, $sidecarExecutable, (Join-Path $installDir "uninstall.exe"))) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Installed file is missing: $required"
            }
          }

          python scripts/build_sidecar.py --smoke-executable $sidecarExecutable
          if ($LASTEXITCODE -ne 0) {
            throw "Installed Sidecar smoke failed"
          }

          $desktop = Start-Process -FilePath $desktopExecutable -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 8
          if ($desktop.HasExited) {
            throw "Installed desktop exited during the launch rehearsal with $($desktop.ExitCode)"
          }
          Stop-Process -Id $desktop.Id -Force
          Wait-Process -Id $desktop.Id -ErrorAction SilentlyContinue

          $installerSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
          $desktopSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $desktopExecutable).Hash
          $sidecarSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $sidecarExecutable).Hash
          $uninstaller = Join-Path $installDir "uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/S") -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with $($uninstall.ExitCode)"
          }
          Start-Sleep -Seconds 2
          if (Test-Path -LiteralPath $installDir) {
            throw "NSIS uninstaller left the rehearsal directory behind: $installDir"
          }

          $evidence = [ordered]@{
            schemaVersion = 1
            gitSha = $env:GITHUB_SHA
            windowsVersion = [Environment]::OSVersion.VersionString
            runnerArchitecture = $env:RUNNER_ARCH
            installerName = $installer.Name
            installerBytes = $installer.Length
            installerSha256 = $installerSha256
            desktopSha256 = $desktopSha256
            sidecarSha256 = $sidecarSha256
            installedSidecarSmoke = "passed"
            desktopLaunch = "passed"
            uninstall = "passed"
            externalPythonRequired = $false
            recordedAtUtc = [DateTime]::UtcNow.ToString("o")
          }
          Write-Output "CLEAN_WINDOWS_REHEARSAL_EVIDENCE_BEGIN"
          Write-Output ($evidence | ConvertTo-Json -Compress)
          Write-Output "CLEAN_WINDOWS_REHEARSAL_EVIDENCE_END"

  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs:
      - test
      - windows-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every blocking CI job to succeed
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows-integration.result }}
        run: |
          echo "test=$TEST_RESULT"
          echo "windows-integration=$WINDOWS_RESULT"
          if [[ "$TEST_RESULT" != "success" || "$WINDOWS_RESULT" != "success" ]]; then
            echo "::error::Merge gate blocked because not all required CI jobs succeeded."
            exit 1
          fi
