name: Publish v0.1.0-pre-teacher.2

on:
  push:
    branches: [main]
    paths:
      - ".github/release/v0.1.0-pre-teacher.2.md"
      - ".github/workflows/release-v0.1.0-pre-teacher.2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0.1.0-pre-teacher.2
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packaged Sidecar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[package]"
          python -m pip check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and smoke Windows NSIS bundle
        working-directory: apps/desktop
        run: npm run bundle:windows

      - name: Record installer checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced"
          }
          $checksumPath = Join-Path $installer.DirectoryName "$($installer.Name).sha256.txt"
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$sha256  $($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "installer=$($installer.Name)"
          Write-Output "sha256=$sha256"

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.1.0-pre-teacher.2"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$env:INSTALLER_PATH" "$env:CHECKSUM_PATH" --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to refresh release assets" }
            exit 0
          }

          gh release create $tag "$env:INSTALLER_PATH" "$env:CHECKSUM_PATH" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Course Project v0.1.0-pre-teacher.2" `
            --notes-file ".github/release/v0.1.0-pre-teacher.2.md" `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub release" }
