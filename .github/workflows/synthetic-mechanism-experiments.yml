name: Synthetic Mechanism Experiments

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/course_project/experiments/**"
      - "src/course_project/evidence/**"
      - "src/course_project/sidecar/track_c_semantic_backend.py"
      - "src/course_project/sidecar/track_d_backend.py"
      - "src/course_project/verification/**"
      - "scripts/run_synthetic_mechanism_experiments.py"
      - "tests/test_experiment_execution.py"
      - "experiments/README.md"
      - ".github/workflows/synthetic-mechanism-experiments.yml"
  push:
    branches: [main]
    paths:
      - "src/course_project/experiments/**"
      - "src/course_project/evidence/**"
      - "src/course_project/sidecar/track_c_semantic_backend.py"
      - "src/course_project/sidecar/track_d_backend.py"
      - "src/course_project/verification/**"
      - "scripts/run_synthetic_mechanism_experiments.py"
      - "tests/test_experiment_execution.py"
      - "experiments/README.md"
      - ".github/workflows/synthetic-mechanism-experiments.yml"

permissions:
  contents: read

jobs:
  synthetic-mechanism-experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Test execution harness
        run: python -m pytest -q tests/test_experiment_execution.py

      - name: Execute and record mechanism experiments
        env:
          CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/run_synthetic_mechanism_experiments.py \
            --outdir experiment-results \
            --code-sha "$CODE_SHA"

      - name: Validate recorded claim scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("experiment-results/records")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["formalBenchmark"] is False
          assert manifest["variants"] == ["heuristic", "naive_vote", "ablation_no_llm"]
          assert not (root / "evidencegraph_pre.json").exists()
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload canonical experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mechanism-experiments-${{ github.event.pull_request.head.sha || github.sha }}
          path: experiment-results/records/
          if-no-files-found: error
          retention-days: 30
