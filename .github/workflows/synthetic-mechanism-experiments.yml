name: Synthetic Mechanism Experiments

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/course_project/experiments/**"
      - "src/course_project/evidence/**"
      - "src/course_project/llm/**"
      - "src/course_project/sidecar/track_c_semantic_backend.py"
      - "src/course_project/sidecar/track_c_llm_semantic_backend.py"
      - "src/course_project/sidecar/track_d_backend.py"
      - "src/course_project/verification/**"
      - "scripts/run_synthetic_mechanism_experiments.py"
      - "scripts/run_full_evidencegraph_mechanism_experiment.py"
      - "scripts/run_no_provenance_ablation.py"
      - "scripts/run_no_verification_ablation.py"
      - "scripts/run_llm_only_mechanism_baseline.py"
      - "scripts/run_llm_verification_mechanism_baseline.py"
      - "tests/test_experiment_execution.py"
      - "tests/test_full_evidencegraph_experiment.py"
      - "tests/test_no_provenance_ablation.py"
      - "tests/test_no_verification_ablation.py"
      - "tests/test_llm_only_mechanism.py"
      - "tests/test_llm_verification_mechanism.py"
      - "experiments/README.md"
      - "experiments/no-provenance-ablation.md"
      - "experiments/no-verification-ablation.md"
      - "experiments/llm-only-mechanism.md"
      - "experiments/llm-verification-mechanism.md"
      - ".github/workflows/synthetic-mechanism-experiments.yml"
  push:
    branches: [main]
    paths:
      - "src/course_project/experiments/**"
      - "src/course_project/evidence/**"
      - "src/course_project/llm/**"
      - "src/course_project/sidecar/track_c_semantic_backend.py"
      - "src/course_project/sidecar/track_c_llm_semantic_backend.py"
      - "src/course_project/sidecar/track_d_backend.py"
      - "src/course_project/verification/**"
      - "scripts/run_synthetic_mechanism_experiments.py"
      - "scripts/run_full_evidencegraph_mechanism_experiment.py"
      - "scripts/run_no_provenance_ablation.py"
      - "scripts/run_no_verification_ablation.py"
      - "scripts/run_llm_only_mechanism_baseline.py"
      - "scripts/run_llm_verification_mechanism_baseline.py"
      - "tests/test_experiment_execution.py"
      - "tests/test_full_evidencegraph_experiment.py"
      - "tests/test_no_provenance_ablation.py"
      - "tests/test_no_verification_ablation.py"
      - "tests/test_llm_only_mechanism.py"
      - "tests/test_llm_verification_mechanism.py"
      - "experiments/README.md"
      - "experiments/no-provenance-ablation.md"
      - "experiments/no-verification-ablation.md"
      - "experiments/llm-only-mechanism.md"
      - "experiments/llm-verification-mechanism.md"
      - ".github/workflows/synthetic-mechanism-experiments.yml"

permissions:
  contents: read

jobs:
  synthetic-mechanism-experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Test execution harnesses
        run: |
          python -m pytest -q \
            tests/test_experiment_execution.py \
            tests/test_full_evidencegraph_experiment.py \
            tests/test_no_provenance_ablation.py \
            tests/test_no_verification_ablation.py \
            tests/test_llm_only_mechanism.py \
            tests/test_llm_verification_mechanism.py

      - name: Execute and record mechanism experiments
        env:
          CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/run_synthetic_mechanism_experiments.py \
            --outdir experiment-results \
            --code-sha "$CODE_SHA"
          python scripts/run_full_evidencegraph_mechanism_experiment.py \
            --outdir experiment-results \
            --code-sha "$CODE_SHA"
          python scripts/run_no_provenance_ablation.py \
            --outdir experiment-results \
            --code-sha "$CODE_SHA"
          python scripts/run_no_verification_ablation.py \
            --outdir experiment-results \
            --code-sha "$CODE_SHA"
          python scripts/run_llm_only_mechanism_baseline.py \
            --outdir experiment-results \
            --code-sha "$CODE_SHA"
          python scripts/run_llm_verification_mechanism_baseline.py \
            --outdir experiment-results \
            --code-sha "$CODE_SHA"

      - name: Validate recorded claim scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("experiment-results/records")
          legacy_manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          full_manifest = json.loads((root / "full-method-manifest.json").read_text(encoding="utf-8"))
          full_record = json.loads((root / "evidencegraph_pre.json").read_text(encoding="utf-8"))
          full_audit = json.loads((root / "evidencegraph_pre.audit.json").read_text(encoding="utf-8"))
          no_provenance_manifest = json.loads((root / "ablation-no-provenance-manifest.json").read_text(encoding="utf-8"))
          no_provenance_record = json.loads((root / "ablation_no_provenance.json").read_text(encoding="utf-8"))
          no_provenance_audit = json.loads((root / "ablation_no_provenance.audit.json").read_text(encoding="utf-8"))
          no_verification_manifest = json.loads((root / "ablation-no-verification-manifest.json").read_text(encoding="utf-8"))
          no_verification_record = json.loads((root / "ablation_no_verification.json").read_text(encoding="utf-8"))
          no_verification_audit = json.loads((root / "ablation_no_verification.audit.json").read_text(encoding="utf-8"))
          llm_only_manifest = json.loads((root / "llm-only-manifest.json").read_text(encoding="utf-8"))
          llm_only_record = json.loads((root / "llm_only.json").read_text(encoding="utf-8"))
          llm_only_audit = json.loads((root / "llm_only.audit.json").read_text(encoding="utf-8"))
          llm_verification_manifest = json.loads((root / "llm-verification-manifest.json").read_text(encoding="utf-8"))
          llm_verification_record = json.loads((root / "llm_verification.json").read_text(encoding="utf-8"))
          llm_verification_audit = json.loads((root / "llm_verification.audit.json").read_text(encoding="utf-8"))

          assert legacy_manifest["formalBenchmark"] is False
          assert legacy_manifest["variants"] == ["heuristic", "naive_vote", "ablation_no_llm"]

          assert full_manifest["formalBenchmark"] is False
          assert full_manifest["realLLMBenchmark"] is False
          assert full_manifest["variant"] == "evidencegraph_pre"
          assert full_record["resultScope"] == "mechanism"
          assert full_record["model"] == {
              "provider": "deterministic-evidencegraph-mechanism",
              "version": "1",
          }
          assert full_record["config"]["realLLMBenchmark"] is False
          full_semantic = next(
              metric for metric in full_record["metrics"]
              if metric["name"] == "field_semantic_accuracy"
          )
          assert full_semantic["evaluable"] is False
          assert full_semantic["value"] is None
          assert full_audit["rejectedWrongHypothesisCount"] >= 1
          assert full_audit["wrongHypothesisMaxConfidence"] > full_audit["correctHypothesisMaxConfidence"]

          assert no_provenance_manifest["formalBenchmark"] is False
          assert no_provenance_manifest["realLLMBenchmark"] is False
          assert no_provenance_manifest["variant"] == "ablation_no_provenance"
          assert no_provenance_record["resultScope"] == "mechanism"
          assert no_provenance_record["config"]["provenanceCollapseEnabled"] is False
          assert no_provenance_record["config"]["rawEvidenceTreatedAsIndependent"] is True
          assert no_provenance_audit["controlCollapsedHypothesisCount"] >= 1
          assert no_provenance_audit["controlMaxDependencyReduction"] >= 1
          assert no_provenance_audit["ablationAllEvidenceIndependent"] is True

          assert no_verification_manifest["formalBenchmark"] is False
          assert no_verification_manifest["realLLMBenchmark"] is False
          assert no_verification_manifest["variant"] == "ablation_no_verification"
          assert no_verification_record["resultScope"] == "mechanism"
          assert no_verification_record["config"]["verificationEnabled"] is False
          assert no_verification_record["config"]["verificationEvidenceUsed"] is False
          assert no_verification_record["config"]["provenanceCollapseEnabled"] is True
          no_verification_constraint = next(
              metric for metric in no_verification_record["metrics"]
              if metric["name"] == "constraint_satisfaction_rate"
          )
          assert no_verification_constraint["evaluable"] is False
          assert no_verification_constraint["value"] is None
          assert no_verification_audit["controlVerificationExecuted"] is True
          assert no_verification_audit["ablationVerificationExecuted"] is False
          assert no_verification_audit["controlRejectedWrongHypothesisCount"] >= 1
          assert no_verification_audit["wrongHypothesisNotRejectedWithoutVerificationCount"] >= 1

          assert llm_only_manifest["formalBenchmark"] is False
          assert llm_only_manifest["realLLMBenchmark"] is False
          assert llm_only_manifest["variant"] == "llm_only"
          assert llm_only_record["resultScope"] == "mechanism"
          assert llm_only_record["model"] == {
              "provider": "deterministic-evidencegraph-mechanism",
              "version": "1",
          }
          assert llm_only_record["config"]["llmOnly"] is True
          assert llm_only_record["config"]["verificationEnabled"] is False
          assert llm_only_record["config"]["verificationEvidenceUsed"] is False
          assert llm_only_record["config"]["provenanceAwareFusionEnabled"] is False
          assert llm_only_record["config"]["provenanceEvidenceUsedForSelection"] is False
          llm_only_constraint = next(
              metric for metric in llm_only_record["metrics"]
              if metric["name"] == "constraint_satisfaction_rate"
          )
          assert llm_only_constraint["evaluable"] is False
          assert llm_only_constraint["value"] is None
          assert llm_only_audit["pairedControlVerificationExecuted"] is True
          assert llm_only_audit["pairedControlRejectedWrongHypothesisCount"] >= 1
          assert llm_only_audit["wrongHypothesisMaxConfidence"] > llm_only_audit["correctHypothesisMaxConfidence"]
          assert llm_only_audit["wrongConfidenceRegionWinnerCount"] >= 1
          assert llm_only_audit["selectedWrongHypothesisCount"] >= 1

          assert llm_verification_manifest["formalBenchmark"] is False
          assert llm_verification_manifest["realLLMBenchmark"] is False
          assert llm_verification_manifest["variant"] == "llm_verification"
          assert llm_verification_record["resultScope"] == "mechanism"
          assert llm_verification_record["model"] == {
              "provider": "deterministic-evidencegraph-mechanism",
              "version": "1",
          }
          assert llm_verification_record["config"]["llmVerificationBaseline"] is True
          assert llm_verification_record["config"]["verificationEnabled"] is True
          assert llm_verification_record["config"]["verificationEvidenceUsed"] is True
          assert llm_verification_record["config"]["provenanceAwareFusionEnabled"] is False
          assert llm_verification_record["config"]["provenanceEvidenceUsedForSelection"] is False
          assert llm_verification_record["config"]["globalSelectionMayAbstainWithoutFusion"] is True
          llm_verification_constraint = next(
              metric for metric in llm_verification_record["metrics"]
              if metric["name"] == "constraint_satisfaction_rate"
          )
          assert llm_verification_constraint["evaluable"] is True
          assert llm_verification_constraint["value"] == llm_verification_audit["constraintSatisfactionRate"]
          assert 0.0 <= llm_verification_constraint["value"] <= 1.0
          assert llm_verification_audit["pairedControlVerificationExecuted"] is True
          assert llm_verification_audit["pairedControlFusionExecuted"] is True
          assert llm_verification_audit["baselineVerificationExecuted"] is True
          assert llm_verification_audit["baselineFusionExecuted"] is False
          assert llm_verification_audit["rejectedWrongHypothesisCount"] >= 1
          assert llm_verification_audit["acceptedCorrectHypothesisCount"] >= 1
          assert llm_verification_audit["selectedWrongHypothesisCount"] == 0
          assert llm_verification_audit["globalAbstainedHypothesisCount"] >= 1
          assert llm_verification_audit["wrongHypothesisMaxConfidence"] > llm_verification_audit["correctHypothesisMaxConfidence"]
          print(json.dumps(llm_verification_manifest, indent=2, sort_keys=True))
          PY

      - name: Upload canonical experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mechanism-experiments-${{ github.event.pull_request.head.sha || github.sha }}
          path: experiment-results/records/
          if-no-files-found: error
          retention-days: 30
