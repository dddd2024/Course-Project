[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-project"
version = "0.1.0"
description = "Unknown binary protocol inference and encrypted traffic behavior analysis course project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "For educational use in this course repository"}
authors = [{name = "Course Project Team"}]
dependencies = []

[project.scripts]
course-project-sidecar = "course_project.sidecar.cli:main"
course-project-doctor = "course_project.doctor:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.23",
]
package = [
  "pyinstaller==6.22.2",
]
public-benchmark = [
  "dpkt==1.9.8",
  "scikit-learn==1.7.2",
]
pcap = [
  "scapy==2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# This module is the fail-closed boundary around arbitrary provider/factory
# implementations. BLE001 is intentional there; C409/SIM102 are local style
# findings that do not justify weakening repository-wide lint policy.
"src/course_project/sidecar/track_c_llm_semantic_backend.py" = ["BLE001", "C409", "SIM102"]
# Experiment-record notes intentionally use wrapped adjacent literals inside a tuple
# for readable scientific claim-boundary text. Keep this style exception local.
"src/course_project/experiments/no_verification.py" = ["ISC004"]
